name: Build Trading Sentinel AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: TradingSentinelAI-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30
