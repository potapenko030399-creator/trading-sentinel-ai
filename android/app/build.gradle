plugins { id 'com.android.application' }

android {
    namespace 'com.tradingsentinel.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tradingsentinel.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
